name: OSV-Scanner

on:
  pull_request:
  push:
    branches: [main]
  # Hourly, for advisories published against dependencies that have not changed.
  schedule:
    - cron: "14 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pinned to a commit, since a third-party action's tags can be moved.
jobs:
  # Fails on any known vulnerability in the committed lockfiles and reports it in the Security tab.
  scan:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  # Fails only on vulnerabilities the pull request adds. The reusable workflow asks for
  # security-events: write, but nothing is uploaded, since a pull request from a fork cannot write
  # security events.
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
