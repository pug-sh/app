<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ICO first, SVG second: SVG-capable browsers take the SVG, Safari falls back to the ICO. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preconnect external origins so off-site links navigate faster on click -->
    <link rel="preconnect" href="https://tshoka.com" />
    <link rel="preconnect" href="https://pug.sh" />
    <link rel="preconnect" href="https://docs.pug.sh" />
    <!-- crossorigin: map assets are CORS fetches and won't reuse a plain preconnect. -->
    <link rel="preconnect" href="https://maps.pug.sh" crossorigin />
    <title>Pug</title>
    <script>
      // Paint the stored theme before first paint. Mirrors src/theme/paint-cache.ts — keep the keys,
      // the cache shape and the auto-contrast rule in sync with it (paint-script.test.ts runs this).
      // Values are applied only in the exact oklch() form the theme compiler writes.
      try {
        const root = document.documentElement
        const mode = JSON.parse(localStorage.getItem('pug:theme') || '"system"')
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) root.classList.add('dark')
        const fallback = { builtin: 'pug', standard: true }
        let cache = JSON.parse(localStorage.getItem('pug:theme-paint') || 'null')
        if (!cache || cache.v !== 1) cache = { v: 1, autoContrast: true, light: fallback, dark: fallback }
        let paint = cache[dark ? 'dark' : 'light'] || fallback
        if (cache.autoContrast && paint.standard && matchMedia('(prefers-contrast: more)').matches) {
          paint = { builtin: 'pug-high-contrast' }
        }
        if (typeof paint.builtin === 'string' && /^[a-z0-9-]+$/.test(paint.builtin)) {
          if (paint.builtin !== 'pug') root.setAttribute('data-theme', paint.builtin)
        } else if (paint.vars && typeof paint.vars === 'object') {
          const name = /^--[a-z0-9-]+$/
          const value = /^oklch\((?:0|1|0\.\d{1,6}) \d+(?:\.\d{1,6})? \d{1,3}(?:\.\d{1,3})?(?: \/ (?:0|0\.\d{1,3}))?\)$/
          for (const key of Object.keys(paint.vars)) {
            if (name.test(key) && value.test(paint.vars[key])) root.style.setProperty(key, paint.vars[key])
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
