<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ICO first, SVG second: SVG-capable browsers take the SVG, Safari falls back to the ICO. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- preconnects -->
    <title>Pug</title>
    <script>
      // Paint the stored theme before first paint. Mirrors src/theme/paint-cache.ts: keep the keys,
      // the cache shape and the auto-contrast rule in sync with it (paint-script.test.ts runs this).
      // Values are applied only in the exact oklch() form the theme compiler writes. The mode and the
      // cache are read apart, so a bad value in one can't stop the other from painting.
      try {
        const root = document.documentElement
        // Read the way themeModeAtom reads it: anything but light or dark follows the OS.
        let mode = 'system'
        try {
          mode = JSON.parse(localStorage.getItem('pug:theme') || '"system"')
        } catch {}
        const fallback = { builtin: 'pug', standard: true }
        let cache = null
        try {
          cache = JSON.parse(localStorage.getItem('pug:theme-paint') || 'null')
        } catch {}
        // v2: the path's project, or on '/' the last one, since '/' redirects there; else the member's own.
        // v1 holds only the member's own.
        let entry = null
        let autoContrast = true
        if (cache && cache.v === 1) {
          entry = cache
          autoContrast = cache.autoContrast
        } else if (cache && cache.v === 2) {
          const projects = cache.projects && typeof cache.projects === 'object' ? cache.projects : {}
          const match = location.pathname.match(/^\/p\/([^/]+)/)
          let id = match ? match[1] : null
          if (location.pathname === '/') id = cache.last
          entry = typeof id === 'string' && Object.hasOwn(projects, id) ? projects[id] : cache.personal
          autoContrast = cache.autoContrast
        }
        if (!entry || typeof entry !== 'object') entry = { light: fallback, dark: fallback }
        // A project's pin beats the mode.
        let dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (entry.pin === 'light' || entry.pin === 'dark') dark = entry.pin === 'dark'
        if (dark) root.classList.add('dark')
        let paint = entry[dark ? 'dark' : 'light'] || fallback
        if (autoContrast && paint.standard && matchMedia('(prefers-contrast: more)').matches) {
          paint = { builtin: 'pug-high-contrast' }
        }
        if (typeof paint.builtin === 'string' && /^[a-z0-9-]+$/.test(paint.builtin)) {
          if (paint.builtin !== 'pug') root.setAttribute('data-theme', paint.builtin)
        } else if (paint.vars && typeof paint.vars === 'object') {
          const name = /^--[a-z0-9-]+$/
          const value = /^oklch\((?:0|1|0\.\d{1,6}) \d+(?:\.\d{1,6})? \d{1,3}(?:\.\d{1,3})?(?: \/ (?:0|0\.\d{1,3}))?\)$/
          for (const key of Object.keys(paint.vars)) {
            if (name.test(key) && value.test(paint.vars[key])) root.style.setProperty(key, paint.vars[key])
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
